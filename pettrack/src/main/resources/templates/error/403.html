<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Acesso Negado')}"></head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6 text-center">
                
                <div class="d-inline-flex p-4 rounded-circle bg-danger bg-opacity-10 text-danger mb-3">
                    <i class="bi bi-shield-slash-fill display-3"></i>
                </div>

                <h2 class="fw-bold text-dark mb-2">403 - Acesso Negado</h2>
                <p class="text-muted mb-4">
                    Você não tem permissão para acessar este recurso. Esta área é restrita a perfis autorizados pelo sistema Spring Security.
                </p>

                <div class="card card-custom p-3 bg-white mb-4 shadow-sm text-start" sec:authorize="isAuthenticated()">
                    <div class="small text-muted mb-1">
                        <strong>Usuário Logado:</strong> <span sec:authentication="name"></span>
                    </div>
                    <div class="small text-muted">
                        <strong>Seu Perfil Atual:</strong> <span class="badge bg-secondary" sec:authentication="principal.authorities[0]"></span>
                    </div>
                </div>

                <div class="d-flex justify-content-center gap-2">
                    <a th:href="@{/dashboard}" class="btn btn-primary px-4 fw-semibold shadow-sm">
                        <i class="bi bi-house-door me-1"></i> Ir para Meu Painel
                    </a>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-secondary px-4 fw-semibold">
                            <i class="bi bi-box-arrow-right me-1"></i> Trocar de Conta
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
