<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Carteirinha de Saúde - ' + ${pet.nome})}"></head>
<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <main class="container my-4 main-content">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <a th:href="@{/portal-tutor/dashboard}" class="text-decoration-none small text-muted d-block mb-1">
                    <i class="bi bi-arrow-left me-1"></i> Voltar ao Painel
                </a>
                <h2 class="fw-bold text-dark mb-0">Carteira de Saúde: <span class="text-primary" th:text="${pet.nome}"></span></h2>
            </div>
            <a th:href="@{/portal-tutor/medicamentos}" class="btn btn-outline-success btn-sm fw-semibold">
                <i class="bi bi-capsule me-1"></i> Acompanhamento de Doses
            </a>
        </div>

        <div class="row g-4">
            <!-- Dados Cadastrais do Pet -->
            <div class="col-lg-4">
                <div class="card card-custom p-4 shadow-sm h-100">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex p-4 rounded-circle bg-primary bg-opacity-10 text-primary fs-1 mb-2">
                            <i class="bi bi-heart-pulse"></i>
                        </div>
                        <h4 class="fw-bold text-dark mb-0" th:text="${pet.nome}"></h4>
                        <span class="badge bg-primary bg-opacity-10 text-primary mt-1" th:text="${pet.especie} + ' • ' + ${pet.raca}"></span>
                    </div>

                    <div class="list-group list-group-flush small">
                        <div class="list-group-item d-flex justify-content-between px-0">
                            <span class="text-muted">Sexo:</span>
                            <span class="fw-semibold" th:text="${pet.sexo.name() == 'M' ? 'Macho' : 'Fêmea'}"></span>
                        </div>
                        <div class="list-group-item d-flex justify-content-between px-0">
                            <span class="text-muted">Idade:</span>
                            <span class="fw-semibold" th:text="${pet.idade} + ' anos'"></span>
                        </div>
                        <div class="list-group-item d-flex justify-content-between px-0">
                            <span class="text-muted">Peso:</span>
                            <span class="fw-semibold" th:text="${pet.peso} + ' kg'"></span>
                        </div>
                        <div class="list-group-item d-flex justify-content-between px-0">
                            <span class="text-muted">Tutor:</span>
                            <span class="fw-semibold" th:text="${pet.tutor.nome}"></span>
                        </div>
                        <div class="list-group-item d-flex justify-content-between px-0">
                            <span class="text-muted">Clínica:</span>
                            <span class="fw-semibold" th:text="${pet.clinica.nome}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Carteira de Vacinas e Protocolos Preventivos -->
            <div class="col-lg-8">
                <div class="card card-custom p-4 shadow-sm mb-4">
                    <h5 class="fw-bold text-dark mb-3">
                        <i class="bi bi-shield-check text-primary me-2"></i> Vacinas e Protocolos Preventivos
                    </h5>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Tipo</th>
                                    <th>Protocolo</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="prot : ${protocolos}">
                                    <td>
                                        <span class="badge bg-light text-dark border" th:text="${prot.tipo.name()}"></span>
                                    </td>
                                    <td class="fw-semibold" th:text="${prot.nome}"></td>
                                    <td>
                                        <span th:if="${prot.status.name() == 'REALIZADO'}" class="badge bg-success">Realizado</span>
                                        <span th:if="${prot.status.name() == 'PENDENTE'}" class="badge bg-warning text-dark">Pendente</span>
                                        <span th:if="${prot.status.name() == 'ATRASADO'}" class="badge bg-danger">Atrasado</span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(protocolos)}">
                                    <td colspan="3" class="text-center py-3 text-muted">Todos os protocolos em dia.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Alertas Ativos do Pet -->
                <div class="card card-custom p-4 shadow-sm">
                    <h5 class="fw-bold text-dark mb-3">
                        <i class="bi bi-bell-fill text-warning me-2"></i> Alertas de Saúde Ativos
                    </h5>

                    <div class="list-group list-group-flush">
                        <div class="list-group-item px-0 py-2" th:each="alerta : ${alertas}">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="badge bg-danger me-2" th:text="${alerta.tipoAlerta.name()}"></span>
                                    <span class="fw-semibold text-dark" th:text="${alerta.descricao}"></span>
                                </div>
                                <span class="badge bg-light text-dark border">Pendente</span>
                            </div>
                        </div>
                        <div class="text-center py-3 text-muted" th:if="${#lists.isEmpty(alertas)}">
                            <i class="bi bi-check-circle text-success me-1"></i> Nenhum alerta ativo para este pet.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
