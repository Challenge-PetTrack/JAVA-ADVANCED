<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${pet.id != null ? 'Editar Pet' : 'Novo Pet'})}"></head>
<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <main class="container my-4 main-content">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold text-dark mb-1" th:text="${pet.id != null ? 'Editar Paciente' : 'Cadastrar Novo Paciente'}"></h2>
                        <p class="text-muted mb-0">Preencha as informações clínicas e cadastrais do animal.</p>
                    </div>
                    <a th:href="@{/admin/pets}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Voltar
                    </a>
                </div>

                <div class="card card-custom p-4 shadow-sm">
                    <form th:action="@{/admin/pets/salvar}" th:object="${pet}" method="post">
                        <!-- Campo Oculto para ID (Edição) -->
                        <input type="hidden" th:field="*{id}">

                        <div class="row g-3">
                            <!-- Nome do Pet -->
                            <div class="col-md-6">
                                <label for="nome" class="form-label fw-semibold">Nome do Pet <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="nome" th:field="*{nome}" th:errorclass="is-invalid" placeholder="Ex: Thor">
                                <div class="invalid-feedback" th:errors="*{nome}"></div>
                            </div>

                            <!-- Espécie -->
                            <div class="col-md-6">
                                <label for="especie" class="form-label fw-semibold">Espécie <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="especie" th:field="*{especie}" th:errorclass="is-invalid" placeholder="Ex: Cão, Gato">
                                <div class="invalid-feedback" th:errors="*{especie}"></div>
                            </div>

                            <!-- Raça -->
                            <div class="col-md-6">
                                <label for="raca" class="form-label fw-semibold">Raça</label>
                                <input type="text" class="form-control" id="raca" th:field="*{raca}" th:errorclass="is-invalid" placeholder="Ex: Golden Retriever">
                                <div class="invalid-feedback" th:errors="*{raca}"></div>
                            </div>

                            <!-- Sexo -->
                            <div class="col-md-6">
                                <label for="sexo" class="form-label fw-semibold">Sexo <span class="text-danger">*</span></label>
                                <select class="form-select" id="sexo" th:field="*{sexo}" th:errorclass="is-invalid">
                                    <option value="">Selecione o sexo...</option>
                                    <option th:each="s : ${sexos}" th:value="${s}" th:text="${s.name() == 'M' ? 'Macho' : 'Fêmea'}"></option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{sexo}"></div>
                            </div>

                            <!-- Idade (Anos) -->
                            <div class="col-md-6">
                                <label for="idade" class="form-label fw-semibold">Idade (anos)</label>
                                <input type="number" step="0.1" class="form-control" id="idade" th:field="*{idade}" th:errorclass="is-invalid" placeholder="Ex: 4.5">
                                <div class="invalid-feedback" th:errors="*{idade}"></div>
                            </div>

                            <!-- Peso (kg) -->
                            <div class="col-md-6">
                                <label for="peso" class="form-label fw-semibold">Peso (kg)</label>
                                <input type="number" step="0.01" class="form-control" id="peso" th:field="*{peso}" th:errorclass="is-invalid" placeholder="Ex: 12.50">
                                <div class="invalid-feedback" th:errors="*{peso}"></div>
                            </div>

                            <!-- Tutor Responsável -->
                            <div class="col-md-6">
                                <label for="tutor" class="form-label fw-semibold">Tutor Responsável <span class="text-danger">*</span></label>
                                <select class="form-select" id="tutor" th:field="*{tutor.id}" required>
                                    <option value="">Selecione o tutor...</option>
                                    <option th:each="t : ${tutores}" th:value="${t.id}" th:text="${t.nome} + ' (' + ${t.email} + ')'"></option>
                                </select>
                            </div>

                            <!-- Clínica Vinculada -->
                            <div class="col-md-6">
                                <label for="clinica" class="form-label fw-semibold">Clínica Veterinária <span class="text-danger">*</span></label>
                                <select class="form-select" id="clinica" th:field="*{clinica.id}" required>
                                    <option value="">Selecione a clínica...</option>
                                    <option th:each="c : ${clinicas}" th:value="${c.id}" th:text="${c.nome}"></option>
                                </select>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/admin/pets}" class="btn btn-light">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                <i class="bi bi-check-lg me-1"></i> Salvar Paciente
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
