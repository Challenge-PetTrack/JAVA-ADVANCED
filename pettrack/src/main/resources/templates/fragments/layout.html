<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - PetTrack'"></title>
    <!-- Bootstrap 5.3 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <!-- Header / Navbar Principal -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-pettrack sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/dashboard}">
                <i class="bi bi-heart-pulse-fill text-danger fs-4"></i>
                <span class="fw-bold">PetTrack</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMain">
                <!-- Menu para Administradores / Veterinários -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" sec:authorize="hasAnyRole('ADMIN', 'VET')">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/pets}"><i class="bi bi-person-lines-fill me-1"></i> Gestão de Pets</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/telemetria}"><i class="bi bi-broadcast text-warning me-1"></i> Simulador IoT</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-info" th:href="@{/swagger}" target="_blank"><i class="bi bi-code-slash me-1"></i> Swagger API</a>
                    </li>
                </ul>

                <!-- Menu para Tutores -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" sec:authorize="hasRole('TUTOR')">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/portal-tutor/dashboard}"><i class="bi bi-house-heart me-1"></i> Meus Pets</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/portal-tutor/medicamentos}"><i class="bi bi-capsule text-success me-1"></i> Medicamentos & Adesão</a>
                    </li>
                </ul>

                <!-- Sessão do Usuário & Logout -->
                <div class="d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                    <div class="text-light text-end">
                        <small class="d-block fw-semibold" sec:authentication="name"></small>
                        <span class="badge bg-primary badge-role" sec:authentication="principal.authorities[0]"></span>
                    </div>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1">
                            <i class="bi bi-box-arrow-right"></i> Sair
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Fragmento de Mensagens Globais / Alertas -->
    <div th:fragment="alertas" class="container mt-3">
        <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${mensagemSucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${mensagemErro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${mensagemAlerta}" class="alert alert-warning alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-bell-fill me-2"></i> <span th:text="${mensagemAlerta}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>

    <!-- Footer -->
    <footer th:fragment="footer" class="py-3 mt-5">
        <div class="container text-center">
            <p class="mb-0">PetTrack © 2026 - FIAP Challenge (Sprint 3 - Java Advanced)</p>
            <small class="text-muted">Sistema de Monitoramento e Gestão de Saúde Animal</small>
        </div>
    </footer>

    <!-- Scripts Bootstrap JS -->
    <script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
